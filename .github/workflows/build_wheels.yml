name: Build wheels

on:
  push:
    branches: [ main ]

  # run this workflow manually from the Actions tab
  workflow_dispatch:

env:
  EnergyPlus_Commit: 0a728a64d2f04afa096144255216f4d7e6cd53be

jobs:
  build_ubuntu:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    steps:
    - name: Checkout pyenergyplus
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: build wheels
      run: |
        pip install setuptools wheel "datamodel-code-generator>=0.55.0"
        git submodule update --init --recursive
        cd EnergyPlus
        git checkout $EnergyPlus_Commit
        cd ..
        sudo apt-get install ninja-build gfortran
        python setup.py bdist_wheel

    - name: Run tests
      run: |
        pip install dist/*.whl
        cd test
        python -m unittest discover -s . -p "test_*.py"

    - uses: actions/upload-artifact@v4
      with:
        name: dist-ubuntu
        path: ./dist


  build_test_osx:
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    steps:
    - name: Checkout pyenergyplus
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install and test
      run: |
        pip install setuptools wheel "datamodel-code-generator>=0.55.0"
        git submodule update --init --recursive
        cd EnergyPlus
        git checkout $EnergyPlus_Commit
        cd ..
        brew install ninja gcc
        export FC=$(ls $(brew --prefix gcc)/bin/gfortran-* | sort | tail -1)
        python setup.py bdist_wheel

    - name: Run tests
      run: |
        pip install dist/*.whl
        cd test
        python -m unittest discover -s . -p "test_*.py"

    - uses: actions/upload-artifact@v4
      with:
        name: dist-osx
        path: ./dist


  build_test_windows:
    runs-on: windows-2022
    env:
      CMAKE_Fortran_COMPILER: "/c/msys64/mingw64/bin/x86_64-w64-mingw32-gfortran.exe"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    defaults:
      run:
        shell: cmd

    steps:
    - name: Checkout pyenergyplus
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install and test
      run: |
        pip install setuptools wheel "datamodel-code-generator>=0.55.0"
        git submodule update --init --recursive
        cd EnergyPlus
        git checkout %EnergyPlus_Commit%
        cd ..
        python setup.py bdist_wheel

    - name: Run tests
      shell: bash
      run: |
        pip install dist/*.whl
        cd test
        python -m unittest discover -s . -p "test_*.py"

    - uses: actions/upload-artifact@v4
      with:
        name: dist-windows
        path: ./dist

  release:
    needs: [build_ubuntu, build_test_osx, build_test_windows]
    if: github.ref == 'refs/heads/cfsfix-25.2.0'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@v4
      with:
        pattern: dist-*
        path: dist
        merge-multiple: true
    - name: Publish the wheels
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        ls -l dist
        gh release create v25.2.0-cfsfix1 dist/*.whl --repo ${{ github.repository }} --target cfsfix-25.2.0 \
          --title "pyenergyplus_lbnl 25.2.0+cfsfix1" \
          --notes "EnergyPlus 25.2.0 (cf7368216c) with the sky and ground diffuse transmittance of complex fenestration read the same way round as the beam (WindowComplexManager.cc lines 1741 and 1783). Install: pip install --force-reinstall \"pyenergyplus_lbnl==25.2.0+cfsfix1\" --find-links https://github.com/${{ github.repository }}/releases/expanded_assets/v25.2.0-cfsfix1"
